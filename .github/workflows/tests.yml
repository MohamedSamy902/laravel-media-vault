name: Tests

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Catch new Laravel majors/minors without waiting for a package release.
    - cron: '0 6 * * 1'

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:     ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, xml, json, intl, fileinfo
          coverage: xdebug

      - name: Resolve testbench version
        id: testbench
        run: |
          # Orchestra Testbench major tracks Laravel as (Laravel major - 2).
          MAJOR=$(echo "${{ matrix.laravel }}" | grep -oE '^[0-9]+')
          echo "version=^$((MAJOR - 2)).0" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          composer require --dev \
            "orchestra/testbench:${{ steps.testbench.outputs.version }}" \
            --no-update --no-interaction
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

      - name: Static analysis
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: vendor/bin/phpstan analyse src --level=6

      - name: Upload coverage
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests

  # Continuously validates the newest stable Laravel without editing this matrix.
  laravel-latest:
    name: Latest stable Laravel (forward compat)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, xml, json, intl, fileinfo
          coverage: none

      - name: Resolve latest Laravel + Testbench
        id: resolve
        run: |
          php -r '
            $json = json_decode(file_get_contents("https://repo.packagist.org/p2/laravel/framework.json"), true);
            $packages = $json["packages"]["laravel/framework"] ?? [];
            $chosen = null;
            foreach ($packages as $pkg) {
              $version = $pkg["version"] ?? "";
              if (!preg_match("/^\d+\.\d+\.\d+$/", $version)) {
                continue; // stable only
              }
              if (version_compare($version, "10.0.0", "<")) {
                continue;
              }
              $chosen = $version;
              break; // Packagist lists newest first
            }
            if ($chosen === null) {
              fwrite(STDERR, "Could not resolve latest Laravel version\n");
              exit(1);
            }
            $major = (int) explode(".", $chosen)[0];
            $testbench = "^" . max(8, $major - 2) . ".0";
            $php = $major >= 13 ? "8.3" : "8.2";
            file_put_contents(getenv("GITHUB_OUTPUT"), "laravel={$chosen}\ntestbench={$testbench}\nphp={$php}\n", FILE_APPEND);
            echo "Latest Laravel: {$chosen}; Testbench: {$testbench}\n";
          '

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ steps.resolve.outputs.testbench }}" --no-update --no-interaction
          composer require "laravel/framework:${{ steps.resolve.outputs.laravel }}" --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests against latest Laravel
        run: vendor/bin/phpunit --colors=always
